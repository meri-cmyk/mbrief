 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.s),iterations:P.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
 const h=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.i)},k,u(P.c)));
 document.open();document.write(h);document.close();
}
const saved=localStorage.getItem('mb_pw');
if(saved)open_(saved).catch(()=>localStorage.removeItem('mb_pw'));
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const pw=document.getElementById('p').value.replace(/\s/g,'');
 document.getElementById('e').textContent='여는 중...';
 try{if(document.getElementById('r').checked)localStorage.setItem('mb_pw',pw);await open_(pw)}
 catch(_){localStorage.removeItem('mb_pw');document.getElementById('e').textContent='비밀번호가 맞지 않습니다'}};
</script></body></html>
